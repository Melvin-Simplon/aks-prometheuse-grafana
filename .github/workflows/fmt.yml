name: Format

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  yamlfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install yamlfmt
        run: |
          curl -sLo yamlfmt.tar.gz \
            https://github.com/google/yamlfmt/releases/download/v0.21.0/yamlfmt_0.21.0_Linux_x86_64.tar.gz
          tar -xzf yamlfmt.tar.gz yamlfmt
          sudo mv yamlfmt /usr/local/bin/yamlfmt

      - name: Check YAML formatting
        run: yamlfmt -dstar -lint "manifests/**/*.yaml"
